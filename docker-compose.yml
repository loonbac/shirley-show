# Producción con Docker. El contenedor solo sirve la página (API + frontend).
#
# El Cloudflare Tunnel corre de forma NATIVA en la máquina anfitriona (no en este
# compose). En el panel del túnel, publica el hostname:
#     shirleyshow.site  ->  http://127.0.0.1:65529
#
# Despliegue:
#   1. Define las variables en un archivo .env junto a este compose.
#   2. docker compose up -d --build

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3001"
      JWT_SECRET: "${JWT_SECRET:?define un secreto largo en .env}"
      ADMIN_USUARIO: "${ADMIN_USUARIO:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?define la clave de admin en .env}"
      WHATSAPP_ON: "${WHATSAPP_ON:-true}"
      # Base pública para los enlaces de entrada (evita Host header injection).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://shirleyshow.site}"
      # CORS: vacío = solo mismo origen (la SPA se sirve desde el backend).
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
    volumes:
      - datos:/app/data
    # Solo se expone a loopback del host: únicamente el cloudflared nativo (que conecta
    # a 127.0.0.1:65529) puede alcanzarlo; nadie llega al puerto directo desde la red.
    ports:
      - "127.0.0.1:65529:3001"

volumes:
  datos:

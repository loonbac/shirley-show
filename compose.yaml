services:
  shirley-show:
    build:
      context: .
      dockerfile: Dockerfile
    # Bridge + loopback publish. Reaching nixos-pc over Tailscale needs the host
    # to forward Docker bridge -> tailscale0 (see docs/deployment-coolify.md).
    # This file is for `docker compose`; koro-panel does not read it and runs
    # its own `docker run` (see docs/deployment-koro-panel.md).
    restart: unless-stopped
    ports:
      - '127.0.0.1:65529:3001'
    environment:
      - SHIRLEY_BIND=0.0.0.0:3001
      - SHIRLEY_DATA_DIR=/app/data
      - SHIRLEY_FRONTEND_DIR=/app/frontend
      # Public origin used to build the ticket link sent over WhatsApp.
      # Without it the link is relative and the buyer cannot open it.
      - SHIRLEY_PUBLIC_BASE_URL=${SHIRLEY_PUBLIC_BASE_URL:-}
      - CMD_API_KEY=${CMD_API_KEY:?CMD_API_KEY requerida}
      - CMD_MODEL=${CMD_MODEL:-stealth/space-bunny-alpha}
      - CMD_BASE_URL=${CMD_BASE_URL:-https://api.commandcode.ai/provider/v1}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - YT_DLP_BIN=${YT_DLP_BIN:-yt-dlp}
      # Default empty = local fallback (no remote GPU). For remote GPU over
      # Tailscale set the IP (e.g. 100.73.247.39).
      - JOSHUA_PC_HOST=${JOSHUA_PC_HOST:-}
      - JOSHUA_PC_USER=${JOSHUA_PC_USER:-loonbac}
      - JOSHUA_PC_SSH_KEY=${JOSHUA_PC_SSH_KEY:-/home/shirley/.ssh/id_ed25519}
      - JOSHUA_PC_PORT=${JOSHUA_PC_PORT:-22}
      - JOSHUA_PC_WAKE_TIMEOUT_MINS=${JOSHUA_PC_WAKE_TIMEOUT_MINS:-10}
      - SHIRLEY_AGENT_TIMEOUT_SECS=${SHIRLEY_AGENT_TIMEOUT_SECS:-120}
      - SHIRLEY_SEPARATION_TIMEOUT_SECS=${SHIRLEY_SEPARATION_TIMEOUT_SECS:-600}
      - SHIRLEY_REMOTE_SEPARATION_TIMEOUT_SECS=${SHIRLEY_REMOTE_SEPARATION_TIMEOUT_SECS:-1500}
      # Vocal separation runs on Colab. The token file must be mounted below;
      # without it every separation fails with colab_token_missing.
      - SHIRLEY_COLAB_BIN=${SHIRLEY_COLAB_BIN:-colab}
      - SHIRLEY_COLAB_TOKEN=${SHIRLEY_COLAB_TOKEN:-/home/shirley/.config/colab/token.json}
      - SHIRLEY_COLAB_GPU=${SHIRLEY_COLAB_GPU:-g4}
      - SHIRLEY_COLAB_OVERLAP=${SHIRLEY_COLAB_OVERLAP:-12}
      - SHIRLEY_COLAB_TIMEOUT_SECS=${SHIRLEY_COLAB_TIMEOUT_SECS:-1800}
    volumes:
      - shirley-data:/app/data
      # SSH private key (ed25519, chmod 600, owned by UID 1000). Never commit it.
      # The host path must exist and be a file: if it is missing, Docker creates a
      # DIRECTORY and the container starts with an unusable key.
      - ${SSH_KEY_HOST_PATH:-/opt/shirley/secrets/id_ed25519}:/home/shirley/.ssh/id_ed25519:ro
      # Colab OAuth token (JSON with access_token, refresh_token and expiry).
      # Same trap: a missing host path becomes a directory and the container
      # starts with an unusable token.
      - ${COLAB_TOKEN_HOST_PATH:-/opt/shirley/secrets/colab-token.json}:/home/shirley/.config/colab/token.json:ro

volumes:
  shirley-data:
